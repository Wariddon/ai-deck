name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows / ${{ matrix.suite }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, desktop-1, desktop-2, desktop-3]
    env:
      CODEX_HOME: ${{ runner.temp }}/ai-deck-ci/codex
      CLAUDE_CONFIG_DIR: ${{ runner.temp }}/ai-deck-ci/claude
      AI_DECK_QA_LIVE: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Prepare Electron and build
        run: |
          node scripts/ensure-electron.cjs
          npm run build
      - name: Run serial tests
        run: node scripts/ci-tests.mjs ${{ matrix.suite }}
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tests-${{ matrix.suite }}
          path: .qa-ci/${{ matrix.suite }}/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
