name: Release
on:
  push:
    tags: ['v0.9.*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v0.9.')
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Package and publish verified portable release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODEX_HOME: ${{ runner.temp }}/ai-deck-release/codex
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/ai-deck-release/claude
        run: |
          node scripts/ensure-electron.cjs
          npm run build
          $packageOutput = @(node scripts/package-windows.mjs)
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
          $packageOutput | Write-Output
          $release = $packageOutput[-1] | ConvertFrom-Json
          node scripts/publish-release.mjs $release.archive
          if ($LASTEXITCODE -ne 0) { throw 'Publishing failed' }
